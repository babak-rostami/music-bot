x-queue-worker: &queue-worker
  image: musicbot-app
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - ./:/var/www
  networks:
    - music-network

x-download-worker: &download-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=download-music --tries=3 --timeout=300 --sleep=3 --max-jobs=100 --max-time=3600

x-crawl-worker: &crawl-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=crawl-musics-page --tries=3 --timeout=600 --sleep=1 --max-jobs=500 --max-time=3600

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: musicbot-app
    container_name: musicbot-app
    restart: unless-stopped
    working_dir: /var/www
    command: php-fpm
    volumes:
      - ./:/var/www
    networks:
      music-network:
        aliases:
          - musicbot-app

  queue-download:
    <<: *download-worker
    container_name: musicbot-queue-download

  queue-crawl:
    <<: *crawl-worker
    container_name: musicbot-queue-crawl

  scheduler:
    image: musicbot-app
    container_name: musicbot-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - music-network

  nginx:
    image: nginx:1.31
    container_name: musicbot-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - music-network

networks:
  music-network:
    external: true
