x-queue-worker: &queue-worker
  image: musicbot-app
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - ./:/var/www
  networks:
    - music-network

x-download-worker: &download-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=download-music --tries=3 --timeout=300 --max-jobs=100 --max-time=3600

x-crawl-worker: &crawl-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=crawl-musics-page --tries=3 --timeout=600 --max-jobs=100 --max-time=3600

x-crawl-bia2music-worker: &crawl-bia2music-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=bia2music-crawler --tries=0 --timeout=600 --max-jobs=100 --max-time=3600

x-general-worker: &general-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=default --tries=3 --timeout=120 --max-jobs=100 --max-time=3600

x-broadcast-worker: &broadcast-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=broadcast --tries=1 --timeout=30 --max-jobs=500 --max-time=3600

x-music-finder-worker: &music-finder-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=music-finder --tries=1 --timeout=90 --max-jobs=200 --max-time=3600

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: musicbot-app
    container_name: musicbot-app
    restart: unless-stopped
    working_dir: /var/www
    command: php-fpm
    volumes:
      - ./:/var/www
      - ./youtube_cookies.txt:/var/www/youtube_cookies.txt
    networks:
      music-network:
        aliases:
          - musicbot-app
    environment:
      - MADELINE_API_ID=${MADELINE_API_ID}
      - MADELINE_API_HASH=${MADELINE_API_HASH}

  queue-download:
    <<: *download-worker
    container_name: musicbot-queue-download

  queue-crawl:
    <<: *crawl-worker
    container_name: musicbot-queue-crawl

  queue-bia2music-crawl:
    <<: *crawl-bia2music-worker
    container_name: musicbot-queue-bia2music-crawl

  queue-general:
    <<: *general-worker
    container_name: musicbot-queue-general

  queue-broadcast:
    <<: *broadcast-worker
    container_name: musicbot-queue-broadcast

  queue-music-finder:
    <<: *music-finder-worker
    container_name: musicbot-queue-music-finder

  scheduler:
    image: musicbot-app
    container_name: musicbot-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - music-network

  nginx:
    image: nginx:1.31
    container_name: musicbot-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - music-network

  ytdlp-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: musicbot-ytdlp-pot
    restart: unless-stopped
    networks:
      - music-network

  madeline-daemon:
    image: musicbot-app
    container_name: musicbot-madeline-daemon
    restart: unless-stopped
    init: true
    working_dir: /var/www
    command: php madeline/daemon.php
    volumes:
      - ./:/var/www
    networks:
      - music-network

networks:
  music-network:
    external: true
