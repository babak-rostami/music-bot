services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: musicbot-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - postgres
    networks:
      - musicbot

  nginx:
    image: nginx:1.31
    container_name: musicbot-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - musicbot

  postgres:
    # PostgreSQL 18
    image: postgres:18
    container_name: musicbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - musicbot

  pgadmin:
    # رابط گرافیکی PostgreSQL
    # مثل phpMyAdmin
    image: dpage/pgadmin4
    container_name: musicbot-pgadmin
    restart: unless-stopped
    environment:
      # ایمیل ورود به pgAdmin
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      # رمز ورود
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      # آدرس:
      #
      # http://IP:5050
      #
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - musicbot
networks:
  musicbot:
volumes:
  postgres_data:
  pgadmin_data: